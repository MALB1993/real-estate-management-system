services:

  app:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: real-state-app-container

    expose:

      - "9000"

    volumes:

      - ./:/var/www

  nginx:

    image: nginx:alpine

    container_name: real-state-nginx

    ports:

      - "8000:80"

    volumes:

      - ./:/var/www

      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:

      - app
  node:
    image: node:22-alpine
    container_name: real-state-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"