services:

  app:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: real-state-app-container

    expose:

      - "9000"

    volumes:

      - ./:/var/www

  nginx:

    image: nginx:alpine

    container_name: real-state-nginx

    ports:

      - "8000:80"

    volumes:

      - ./:/var/www

      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:

      - app